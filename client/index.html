<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CoursessionAI turns YouTube playlists into structured courses with AI-powered summaries, quizzes, notes, bookmarks, and chat." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var localTheme = window.localStorage.getItem('color-theme');
          var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (localTheme === 'dark' || (!localTheme && systemDark) || !localTheme) {
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.removeAttribute('data-theme');
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
    <title>CoursessionAI — Turn YouTube playlists into courses</title>
  </head>
  <body>
    <div id="root">
      <style>
        #root:not(:empty) {
          --loader-background: var(--theme-background, #111111);
          --loader-surface: var(--theme-surface, #111111);
          --loader-surface-container: var(--theme-surface-container, #1a1a1a);
          --loader-outline: var(--theme-outline-variant, #2a2a2a);
          --loader-text: var(--theme-on-surface, #ffffff);
          --loader-muted: var(--theme-on-surface-variant, #a3a3a3);
          --loader-primary: var(--theme-primary, #ffffff);
        }

        #root:not(:empty) .app-loading-shell {
          min-height: 100vh;
          display: flex;
          flex-direction: column;
          background: var(--loader-background);
          color: var(--loader-text);
          font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        #root:not(:empty) .app-loading-nav {
          height: 64px;
          border-bottom: 1px solid var(--loader-outline);
          background: color-mix(in srgb, var(--loader-surface) 92%, transparent);
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding: 0 24px;
        }

        #root:not(:empty) .app-loading-mark,
        #root:not(:empty) .app-loading-line {
          display: block;
          border-radius: 999px;
          background: var(--loader-surface-container);
        }

        #root:not(:empty) .app-loading-brand {
          display: flex;
          align-items: center;
          gap: 12px;
        }

        #root:not(:empty) .app-loading-logo {
          width: 40px;
          height: 40px;
          border-radius: 12px;
          background: var(--loader-primary);
        }

        #root:not(:empty) .app-loading-title {
          width: 148px;
          height: 18px;
        }

        #root:not(:empty) .app-loading-actions {
          display: flex;
          gap: 12px;
        }

        #root:not(:empty) .app-loading-pill {
          width: 88px;
          height: 34px;
        }

        #root:not(:empty) .app-loading-main {
          flex: 1;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 24px;
          text-align: center;
        }

        #root:not(:empty) .app-loading-spinner {
          width: 44px;
          height: 44px;
          margin: 0 auto 18px;
          border-radius: 999px;
          border: 3px solid var(--loader-outline);
          border-top-color: var(--loader-primary);
          animation: app-loading-spin 0.9s linear infinite;
        }

        #root:not(:empty) .app-loading-text {
          margin: 0;
          color: var(--loader-muted);
          font-size: 14px;
          font-weight: 600;
          letter-spacing: 0;
        }

        @keyframes app-loading-spin {
          to { transform: rotate(360deg); }
        }

        @media (max-width: 640px) {
          #root:not(:empty) .app-loading-nav {
            padding: 0 16px;
          }

          #root:not(:empty) .app-loading-actions {
            display: none;
          }
        }
      </style>
      <div class="app-loading-shell" role="status" aria-live="polite">
        <div class="app-loading-nav">
          <div class="app-loading-brand">
            <span class="app-loading-logo"></span>
            <span class="app-loading-line app-loading-title"></span>
          </div>
          <div class="app-loading-actions" aria-hidden="true">
            <span class="app-loading-mark app-loading-pill"></span>
            <span class="app-loading-mark app-loading-pill"></span>
          </div>
        </div>
        <main class="app-loading-main">
          <div>
            <div class="app-loading-spinner" aria-hidden="true"></div>
            <p class="app-loading-text">Loading CoursessionAI...</p>
          </div>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
